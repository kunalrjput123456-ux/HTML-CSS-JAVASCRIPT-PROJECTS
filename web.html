<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhumi's Universe</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #000;
    font-family: "Arial Rounded MT Bold", "Comic Sans MS", Arial, sans-serif;
}

.space {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;

    background:
        radial-gradient(circle at center,
        #172052 0%,
        #080d2b 45%,
        #000 100%);
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    0% {
        opacity: .2;
        transform: scale(.5);
    }

    100% {
        opacity: 1;
        transform: scale(1.5);
    }
}

.title {
    position: absolute;
    top: 25px;
    width: 100%;

    text-align: center;

    color: white;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 6px;

    text-shadow:
        0 0 10px white,
        0 0 25px #6575ff;

    z-index: 100;
}


/* ================= SUN ================= */

.sun {
    position: absolute;

    width: 150px;
    height: 150px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(circle,
        #fffbd0 0%,
        #fff05a 22%,
        #ffc400 50%,
        #ff7200 75%,
        #ff2600 100%);

    box-shadow:
        0 0 30px #ffd000,
        0 0 70px #ff9d00,
        0 0 130px #ff4500;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 10;
}

.sun-name {
    color: #ff4fa3;

    font-size: 17px;
    font-weight: 900;

    line-height: 1.1;
    text-align: center;

    text-shadow:
        0 2px 4px rgba(0,0,0,.8),
        0 0 8px white;

    z-index: 20;
}


/* ================= EARTH ORBIT ================= */

.earth-orbit {

    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border: 1px solid rgba(255,255,255,.18);

    border-radius: 50%;

    z-index: 2;
}


/* ================= EARTH SYSTEM ================= */

.earth-system {

    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    animation: earthAroundSun 12s linear infinite;

    z-index: 20;
}

@keyframes earthAroundSun {

    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


/* ================= EARTH ================= */

.earth {

    position: absolute;

    width: 75px;
    height: 75px;

    left: calc(50% + 250px - 37.5px);
    top: calc(50% - 37.5px);

    border-radius: 50%;

    background:
        radial-gradient(circle at 30% 25%,
        #55dcff 0%,
        #1695ff 35%,
        #0756bd 70%,
        #022c67 100%);

    box-shadow:
        0 0 20px #169cff,
        0 0 45px rgba(20,140,255,.7);

    z-index: 30;
}


/* ================= EARTH ROTATION ================= */

.earth-body {

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    overflow: hidden;

    animation: earthRotation 3s linear infinite;
}

@keyframes earthRotation {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* ================= EARTH LAND ================= */

.land1 {
    position: absolute;

    width: 35px;
    height: 20px;

    background: #38a852;

    border-radius: 60% 40% 50% 45%;

    top: 12px;
    left: 9px;
}

.land2 {
    position: absolute;

    width: 28px;
    height: 22px;

    background: #38a852;

    border-radius: 45% 55% 50% 40%;

    right: 8px;
    bottom: 12px;
}

.land3 {
    position: absolute;

    width: 16px;
    height: 13px;

    background: #38a852;

    border-radius: 50%;

    right: 10px;
    top: 30px;
}


/* ================= EARTH NAME ================= */

.earth-name {

    position: absolute;

    width: 100%;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    text-align: center;

    color: #ff4fa3;

    font-size: 14px;
    font-weight: 900;

    letter-spacing: 1px;

    text-shadow:
        0 2px 4px black,
        0 0 7px white;

    z-index: 100;

    pointer-events: none;
}


/* ================= MOON ORBIT ================= */

.moon-orbit {

    position: absolute;

    width: 180px;
    height: 180px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border: 1px solid rgba(255,255,255,.15);

    border-radius: 50%;

    animation: moonAroundEarth 4s linear infinite;

    z-index: 80;
}

@keyframes moonAroundEarth {

    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


/* ================= MOON ================= */

.moon {

    position: absolute;

    width: 42px;
    height: 42px;

    left: 69px;
    top: -21px;

    border-radius: 50%;

    background: #bdbdbd;

    box-shadow: none;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 100;
}


/* ================= MOON ROTATION ================= */

.moon-body {

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    animation: moonRotation 2.5s linear infinite;
}

@keyframes moonRotation {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* ================= MOON NAME ================= */

.moon-name {

    position: absolute;

    width: 100%;

    left: 0;
    top: 50%;

    transform: translateY(-50%);

    text-align: center;

    /* ONLY CHANGE: KUNAL BLACK */

    color: black;

    font-size: 9px;
    font-weight: 900;

    letter-spacing: .5px;

    text-shadow: none;

    z-index: 200;

    pointer-events: none;
}


/* ================= MADE BY ================= */

.made-by {

    position: absolute;

    right: 18px;
    bottom: 15px;

    color: white;

    font-size: 14px;
    font-weight: bold;

    z-index: 500;

    text-shadow:
        0 0 8px #6878ff;
}


/* ================= SHOOTING STAR ================= */

.shooting-star {

    position: absolute;

    width: 130px;
    height: 2px;

    background:
        linear-gradient(
        90deg,
        transparent,
        white
        );

    transform: rotate(-35deg);

    animation: shooting 5s linear infinite;

    z-index: 1;
}

@keyframes shooting {

    0% {
        left: -150px;
        top: 15%;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        left: 110%;
        top: 55%;
        opacity: 0;
    }

    100% {
        left: 110%;
        opacity: 0;
    }
}


/* ================= MOBILE ================= */

@media(max-width:600px) {

    .title {
        font-size: 20px;
        letter-spacing: 3px;
    }

    .sun {
        width: 110px;
        height: 110px;
    }

    .earth-orbit,
    .earth-system {
        width: 330px;
        height: 330px;
    }

    .earth {
        width: 58px;
        height: 58px;

        left: calc(50% + 165px - 29px);
        top: calc(50% - 29px);
    }

    .earth-name {
        font-size: 10px;
    }

    .moon-orbit {
        width: 140px;
        height: 140px;
    }

    .moon {
        width: 35px;
        height: 35px;

        left: 52px;
        top: -18px;
    }

    .moon-name {
        font-size: 7px;
    }
}

</style>
</head>


<body>

<div class="space">


    <!-- TITLE -->

    <div class="title">
        BHUMI'S UNIVERSE
    </div>


    <!-- SUN -->

    <div class="sun">

        <div class="sun-name">
            BHUMI'S<br>
            MOOD
        </div>

    </div>


    <!-- EARTH ORBIT -->

    <div class="earth-orbit"></div>


    <!-- EARTH -->

    <div class="earth-system">

        <div class="earth">

            <div class="earth-body">

                <div class="land1"></div>
                <div class="land2"></div>
                <div class="land3"></div>

            </div>


            <div class="earth-name">
                BHUMII
            </div>


            <!-- MOON -->

            <div class="moon-orbit">

                <div class="moon">

                    <div class="moon-body"></div>

                    <div class="moon-name">
                        KUNAL
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- SHOOTING STAR -->

    <div class="shooting-star"></div>


    <!-- STARS -->

    <div class="star" style="left:5%;top:10%;"></div>
    <div class="star" style="left:12%;top:25%;"></div>
    <div class="star" style="left:20%;top:8%;"></div>
    <div class="star" style="left:28%;top:18%;"></div>
    <div class="star" style="left:38%;top:7%;"></div>

    <div class="star" style="left:60%;top:12%;"></div>
    <div class="star" style="left:70%;top:25%;"></div>
    <div class="star" style="left:82%;top:10%;"></div>
    <div class="star" style="left:92%;top:30%;"></div>

    <div class="star" style="left:8%;top:60%;"></div>
    <div class="star" style="left:18%;top:80%;"></div>
    <div class="star" style="left:30%;top:70%;"></div>

    <div class="star" style="left:70%;top:75%;"></div>
    <div class="star" style="left:82%;top:60%;"></div>
    <div class="star" style="left:94%;top:85%;"></div>

    <div class="star" style="left:45%;top:85%;"></div>
    <div class="star" style="left:55%;top:70%;"></div>


    <!-- MADE BY -->

    <div class="made-by">
        Made by Kunal ❤️
    </div>

</div>

</body>
</html>
