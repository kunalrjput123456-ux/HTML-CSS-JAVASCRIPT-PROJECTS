<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator KUNAL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
        }

        .calculator {
            width: 330px;
            background: #d70bb2;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .display {
            width: 100%;
            height: 90px;
            background: #0be8ad;
            color: white;
            border: none;
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 15px;
            font-size: 38px;
            text-align: right;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            transition: 0.15s;
        }

        /* Number buttons */
        .number {
            background: #9d79ff;
            color: white;
        }

        /* Orange operator buttons */
        .operator {
            background: orange;
            color: white;
        }

        /* Clear button */
        .clear {
            background: #ff9500;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .zero {
            grid-column: span 2;
            border-radius: 30px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" class="display" value="0" disabled>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button class="operator" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="addValue('%')">%</button>
            <button class="operator" onclick="addValue('/')">÷</button>

            <button class="number" onclick="addValue('7')">7</button>
            <button class="number" onclick="addValue('8')">8</button>
            <button class="number" onclick="addValue('9')">9</button>
            <button class="operator" onclick="addValue('*')">×</button>

            <button class="number" onclick="addValue('4')">4</button>
            <button class="number" onclick="addValue('5')">5</button>
            <button class="number" onclick="addValue('6')">6</button>
            <button class="operator" onclick="addValue('-')">−</button>

            <button class="number" onclick="addValue('1')">1</button>
            <button class="number" onclick="addValue('2')">2</button>
            <button class="number" onclick="addValue('3')">3</button>
            <button class="operator" onclick="addValue('+')">+</button>

            <button class="number zero" onclick="addValue('0')">0</button>
            <button class="number" onclick="addValue('.')">.</button>
            <button class="operator" onclick="calculate()">=</button>

        </div>
    </div>


    <script>
        const display = document.getElementById("display");

        function addValue(value) {

            if (display.value === "0") {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteLast() {
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = "0";
            }
        }

        function calculate() {
            try {
                let expression = display.value;

                // Percentage calculation
                expression = expression.replace(
                    /(\d+(\.\d+)?)%/g,
                    "($1/100)"
                );

                display.value = eval(expression);
            } 
            catch (error) {
                display.value = "Error";
            }
        }
    </script>

</body>
</html>
